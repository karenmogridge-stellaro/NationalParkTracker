<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .g{fill:#1f5e34;}
      .w{fill:#ffffff;}
      .stroke{stroke:#1f5e34;stroke-width:24;}
      .text{font-family:'Open Sans','Open Sans Pro',Arial,sans-serif;font-weight:700;fill:#1f5e34;}
    </style>
  </defs>

  <!-- Pin / Shield -->
  <path class="w stroke" d="M512 80
    C320 80 200 200 200 360
    L200 560
    C200 720 360 820 512 980
    C664 820 824 720 824 560
    L824 360
    C824 200 704 80 512 80 Z"/>

  <!-- Top Panel -->
  <rect x="240" y="140" width="544" height="260" class="g" rx="40"/>

  <!-- Paw -->
  <circle cx="360" cy="250" r="28" class="w"/>
  <circle cx="320" cy="210" r="18" class="w"/>
  <circle cx="360" cy="200" r="18" class="w"/>
  <circle cx="400" cy="210" r="18" class="w"/>
  <circle cx="360" cy="300" r="36" class="w"/>

  <!-- Tent -->
  <path d="M480 300 L540 180 L600 300 Z" class="w"/>
  <rect x="528" y="240" width="24" height="60" class="g"/>

  <!-- Bike -->
  <circle cx="700" cy="280" r="40" class="w" stroke="#1f5e34" stroke-width="8"/>
  <circle cx="780" cy="280" r="40" class="w" stroke="#1f5e34" stroke-width="8"/>
  <line x1="700" y1="280" x2="740" y2="220" stroke="#ffffff" stroke-width="8"/>
  <line x1="740" y1="220" x2="780" y2="280" stroke="#ffffff" stroke-width="8"/>
  <line x1="740" y1="220" x2="740" y2="180" stroke="#ffffff" stroke-width="8"/>

  <!-- Divider -->
  <rect x="240" y="420" width="544" height="120" class="w"/>

  <!-- Text -->
  <text x="512" y="500" text-anchor="middle" font-size="96" class="text">ParkAtlas</text>

  <!-- Bottom Trail -->
  <path d="M260 560 L764 560 L700 700 L512 900 L324 700 Z" class="g"/>
  <path d="M512 880 C560 820 600 780 640 720 C600 720 560 740 520 780 C480 820 440 820 400 720 C440 720 480 740 512 880 Z" class="w"/>
</svg>
